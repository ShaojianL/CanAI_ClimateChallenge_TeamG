[theme]
base = "light"
primaryColor = "#2847A1"
backgroundColor = "#F8F8F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#26374A"
borderColor = "#D4D4D4"
font = "'Noto Sans', Arial, sans-serif"
baseFontSize = 16
headingFontSizes = ["32px", "24px", "20px", "18px", "16px", "16px"]
headingFontWeights = [700, 700, 700, 700, 700, 700]
linkUnderline = true
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F8F8"
